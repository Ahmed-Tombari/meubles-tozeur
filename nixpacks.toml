[phases.setup]
nixPkgs = ["...", "php84", "php84Packages.composer", "nodejs"]

[phases.build]
dependsOn = ["setup"]
cmds = ["composer install --ignore-platform-reqs", "npm install", "npm run build"]

[phases.deploy]
dependsOn = ["build"]
cmds = ["php artisan migrate --force", "php artisan serve --host=0.0.0.0 --port=$PORT"]
