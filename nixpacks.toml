[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs", "mysql-client"]

[phases.build]
cmds = ["composer install --no-dev --no-interaction --ignore-platform-reqs", "npm install", "npm run build"]

[phases.deploy]
cmds = [
    "php artisan migrate --force",
    "php artisan storage:link",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan serve --host=0.0.0.0 --port=$PORT"
]
